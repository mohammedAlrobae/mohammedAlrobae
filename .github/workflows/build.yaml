name: README build
on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Verify Secret
        env:
          TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=Missing Secret::ACCESS_TOKEN secret is not set in Repository Settings -> Secrets and variables -> Actions!"
            echo "### ⚠️ ACCESS_TOKEN Secret Missing" >> $GITHUB_STEP_SUMMARY
            echo "Please go to **Settings > Secrets and variables > Actions** and add \`ACCESS_TOKEN\`." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "ACCESS_TOKEN is present (length: ${#TOKEN})"
          fi

      - name: Update SVG stats & dynamic uptime
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: mohammedAlrobae
        run: python today.py

      - name: Commit and push changes
        run: |-
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add cache dark_mode.svg light_mode.svg
          git commit -m "Update README stats & uptime [skip ci]" || echo "No changes to commit"
          git push

